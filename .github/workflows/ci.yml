name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Kiểm tra cú pháp
        run: python -m py_compile bot.py
      - name: Lint
        run: ruff check bot.py --select E9,F63,F7,F82,F401
